<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cream background -->
  <rect width="1200" height="630" fill="#FFFFEA"/>
  
  <!-- Subtle line border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#D9D8C4" stroke-width="1.5"/>

  <!-- Brand logo & wordmark in top left -->
  <g transform="translate(80, 80)">
    <!-- Logo glyph -->
    <rect x="0" y="8" width="5.5" height="22" rx="2.5" fill="#1A1A1A"/>
    <rect x="10.5" y="2" width="5.5" height="28" rx="2.5" fill="#1A1A1A"/>
    <rect x="21" y="2" width="3.5" height="3.5" rx="1" fill="#1A1A1A"/>
    <rect x="26.5" y="4" width="3.5" height="3.5" rx="1" fill="#1A1A1A"/>
    <rect x="21" y="8" width="3.5" height="3.5" rx="1" fill="#1A1A1A"/>
    <rect x="26.5" y="10" width="3.5" height="3.5" rx="1" fill="#1A1A1A"/>
    <rect x="21" y="14" width="3.5" height="3.5" rx="1" fill="#1A1A1A"/>
    <rect x="21" y="19" width="7" height="11" rx="2" fill="#1A1A1A"/>
    <!-- Wordmark -->
    <text x="44" y="26" font-family="'Figtree', system-ui, sans-serif" font-size="28" font-weight="600" fill="#1A1A1A" letter-spacing="-0.02em">Veil</text>
  </g>

  <!-- Pixel-grid waveform pill glyph -->
  <g transform="translate(80, 180)">
    <rect width="140" height="56" rx="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <!-- 6 cols x 4 rows pixel grid -->
    <g transform="translate(42, 16)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="10" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="20" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="30" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="40" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="50" y="0" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>

      <!-- Row 1 -->
      <rect x="0" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="10" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="20" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="30" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="40" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="50" y="8" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>

      <!-- Row 2 -->
      <rect x="0" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="10" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="20" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="30" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="40" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="50" y="16" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>

      <!-- Row 3 -->
      <rect x="0" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="10" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="20" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="30" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
      <rect x="40" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.9"/>
      <rect x="50" y="24" width="6" height="6" rx="1" fill="#1A1A1A" opacity="0.3"/>
    </g>
  </g>

  <!-- Hero Headline: upright line 1, full italic line 2 -->
  <text x="80" y="340" font-family="'EB Garamond', Georgia, serif" font-size="82" font-weight="400" fill="#1A1A1A" letter-spacing="-0.02em">
    Hide words
  </text>
  <text x="80" y="430" font-family="'EB Garamond', Georgia, serif" font-size="82" font-weight="400" font-style="italic" fill="#1A1A1A" letter-spacing="-0.02em">
    in plain sight.
  </text>

  <!-- Subtitle -->
  <text x="80" y="520" font-family="'Figtree', system-ui, sans-serif" font-size="24" font-weight="400" fill="#6B6A5E">
    Put a secret message inside any photo. Only someone with your key can read it.
  </text>
</svg>
