services:
  # 1. FastAPI Web Service (Backend)
  - type: web
    name: veil-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React Vite Static Site (Frontend)
  - type: web
    name: veil-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://veil-backend.onrender.com/api/v1
      - key: VITE_USE_MOCK
        value: "false"
